<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RecallDesk cover</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Public+Sans:wght@400..800&family=Roboto+Mono:wght@400;500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* The card rows below come from the real published card (agent/cards/latest_little-loop.json). */
  /* Plain white sheet, serif headline, the real card set straight beside it: no props, no shadow. */
  #frame { width: 1000px; height: 420px; padding: 0; border: 0; background: #ffffff; }
  #frame::before { height: 6px; }
  .left { position: absolute; left: 64px; top: 66px; width: 470px; }
  .k { font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--a600); text-transform: uppercase; }
  .h { margin-top: 16px; font-family: var(--serif); font-weight: 700; font-size: 50px; line-height: 1.16; color: var(--n900); }
  .h span { color: var(--stop); }
  .m { margin-top: 20px; font-size: 18px; line-height: 1.5; color: var(--n700); font-weight: 400; max-width: 440px; }
  .m b { color: var(--n900); font-weight: 700; }
  .t { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--n200); font-size: 13px; color: var(--n600); max-width: 440px; }
  .card {
    position: absolute; left: 588px; top: 66px; width: 360px;
    background: #ffffff; border: 1px solid var(--n400); border-top: 4px solid var(--n900); overflow: hidden;
  }
  .card .top { gap: 10px; display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px 10px; border-bottom: 1px solid var(--n200); }
  .card .top b { font-family: var(--serif); font-weight: 700; font-size: 15px; white-space: nowrap; }
  .card .top span { font-size: 11px; color: var(--n600); white-space: nowrap; }
  .sec { padding: 11px 16px 4px; }
  .row { padding: 7px 0 8px; border-bottom: 1px solid var(--n200); }
  .row:last-child { border-bottom: 0; }
  .row .i { font-size: 13.5px; font-weight: 600; color: var(--n900); line-height: 1.3; }
  .row .d { margin-top: 3px; font-family: var(--mono); font-size: 10.5px; color: var(--n600); }
  .card .foot2 { padding: 8px 16px 10px; font-size: 11px; color: var(--n600); border-top: 1px solid var(--n200); background: var(--n100); }
</style>
</head>
<body>
<div id="frame">
  <div class="left">
    <div class="k">RecallDesk · a weekly recall check for resale shops</div>
    <div class="h">Before you list it,<br><span>check it.</span></div>
    <div class="m" id="m"></div>
    <div class="t">A 397B teacher writes the spec, a fine-tuned 4B reads every item, code makes the call. Every Thursday.</div>
  </div>
  <div class="card" id="card"></div>
</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const K = RD.card, S = RD.scan, CO = RD.corpus, esc = RDV.esc;
  document.getElementById("m").innerHTML = S.status === "real" && S.listings_seen
    ? `<b>${RDV.n(S.listings_seen)}</b> live eBay listings checked against <b>${CO.recalls}</b> CPSC recalls. One printable card a week for resale shops.`
    : `<b>${CO.recalls}</b> CPSC recalls since July, <b>${CO.childrens}</b> for kids. One printable card a week for resale shops.`;
  const split = (item) => { const m = item.match(/^(.*?)\s*\(model ([^)]+)\)\s*$/); return m ? [m[1], m[2]] : [item, null]; };
  const dns = (K.do_not_sell || []).slice(0, 2), chk = (K.check_label || []).slice(0, 1);
  const week = K.week_of ? new Date(K.week_of + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }) : "";
  let h = `<div class="top"><b>${esc(K.shop_name || "Your shop")}</b><span>week of ${esc(week)}</span></div>`;
  h += `<div class="sec">${RDV.stamp("match")}` + dns.map((r) => {
    const [name, id] = split(r.item);
    return `<div class="row"><div class="i">${esc(RDV.short(name, 46))}</div><div class="d">${id ? "model " + esc(id) + " · " : ""}CPSC ${esc(r.recall_number)}</div></div>`;
  }).join("") + `</div>`;
  h += `<div class="sec">${RDV.stamp("check")}` + chk.map((r) => {
    const look = (r.look_for || "").split(";")[0];
    return `<div class="row"><div class="i">${esc(RDV.short(r.item, 46))}</div><div class="d">look for: ${esc(RDV.short(look, 44))}</div></div>`;
  }).join("") + `</div>`;
  h += `<div class="foot2">${K.items_checked || ""} items checked · ${(K.do_not_sell || []).length} do not sell · ${(K.check_label || []).length} check label</div>`;
  document.getElementById("card").innerHTML = h;
  RDV.mark(["card"]);
})();
</script>
</body>
</html>
