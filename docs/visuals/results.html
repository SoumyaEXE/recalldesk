<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accuracy by model</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Public+Sans:wght@400..800&family=Roboto+Mono:wght@400;500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
</head>
<body>
<div id="frame">
  <div class="kicker" id="kicker"></div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div class="chart" id="chart"></div>
  <p class="foot" id="foot"></p>
  <div class="src"><span>Source: ml/results/eval.json (python -m ml.eval) · CI = 10,000-sample bootstrap · cost = measured tokens × Tinker list prices</span><span class="brand">RECALLDESK</span></div>
</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const E = RD.eval, M = E.models, C = RDV.C;
  const SUB = {
    lora: "fine-tuned on Tinker on the teacher's labels",
    base: "same short prompt as the LoRA",
    base_guided: "given the teacher's long rulebook",
    teacher: "labelled the training pairs; reads the CPSC text",
    heuristic: "identifier + keyword rules, no model",
  };
  const rows = E.order.map((r) => ({ r, ...M[r], sub: SUB[r] || (r.startsWith("backboard:") ? "open-weight baseline via Backboard" : "") }))
    .filter((d) => d.acc != null).sort((a, b) => b.acc - a.acc);
  const L = M.lora, B = M.base;
  document.getElementById("kicker").textContent = `Held-out recalls · ${E.test_size} (recall, listing) pairs · graded vs teacher + rule 7 (code)`;
  document.getElementById("h1").textContent = L && B
    ? `Fine-tuning moved the 4B from ${B.acc.toFixed(3)} to ${L.acc.toFixed(3)} accuracy, at ${RDV.money(L.cost_per_1k_usd)} per 1,000 listings`
    : `Accuracy by model on held-out recalls`;
  document.getElementById("sub").textContent =
    `Three-way verdict (match / check / no_match) against the answer key: the teacher's label with rule 7 enforced by code (not a human). The test recalls never appear in training. One attempt per pair, temperature 0; invalid JSON counts as wrong.`;

  const W = 718, LW = 262, x0 = LW, barW = 330, costX = W, top0 = 30, rowH = 54, barH = 20;
  const H = top0 + rows.length * rowH + 26, sx = (v) => x0 + v * barW;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Accuracy: ${rows.map((r) => r.name + " " + r.acc.toFixed(3)).join(", ")}">`;
  s += `<text x="${x0}" y="12" font-size="11" font-weight="600" fill="${C.ink3}" letter-spacing="0.06em">ACCURACY (95% CI)</text>`;
  s += `<text x="${costX}" y="12" text-anchor="end" font-size="11" font-weight="600" fill="${C.ink3}" letter-spacing="0.06em">$ / 1K PAIRS</text>`;
  for (let v = 0; v <= 1.0001; v += 0.25) {
    const x = sx(v);
    s += `<line x1="${x}" y1="${top0 - 6}" x2="${x}" y2="${top0 + rows.length * rowH - 6}" stroke="${v === 0 ? "#a9aeb1" : C.grid}"/>`;
    s += `<text x="${x}" y="${top0 + rows.length * rowH + 10}" text-anchor="middle" ${RDV.MONO} font-size="10.5" fill="${C.ink3}">${v.toFixed(2)}</text>`;
  }
  rows.forEach((d, i) => {
    const yMid = top0 + i * rowH + rowH / 2 - 6, hi = d.r === "lora";
    s += `<text x="0" y="${yMid - 3}" font-size="13.5" font-weight="${hi ? 700 : 500}" fill="${C.ink}">${RDV.esc(RDV.short(d.name, 36))}</text>`;
    s += `<text x="0" y="${yMid + 13}" font-size="11.5" fill="${C.ink3}">${RDV.esc(d.sub)}</text>`;
    const x1 = sx(d.acc), y = yMid - barH / 2;
    s += `<rect x="${x0}" y="${y}" width="${x1 - x0}" height="${barH}" rx="3" fill="${hi ? C.ours : C.other}"/>`;
    if (d.acc_ci && d.acc_ci.length === 2) {
      const [lo, up] = d.acc_ci.map(sx);
      s += `<line x1="${lo}" x2="${up}" y1="${yMid}" y2="${yMid}" stroke="${C.ink}" stroke-width="1.4"/>`;
      s += `<line x1="${lo}" x2="${lo}" y1="${yMid - 5}" y2="${yMid + 5}" stroke="${C.ink}" stroke-width="1.4"/><line x1="${up}" x2="${up}" y1="${yMid - 5}" y2="${yMid + 5}" stroke="${C.ink}" stroke-width="1.4"/>`;
    }
    const lx = Math.max(x1, d.acc_ci ? sx(d.acc_ci[1]) : x1) + 8;
    s += `<text x="${lx}" y="${yMid + 4.5}" ${RDV.MONO} font-size="13" font-weight="${hi ? 700 : 500}" fill="${hi ? C.ink : C.ink2}">${d.acc.toFixed(3)}</text>`;
    if (d.acc_ci) s += `<text x="${lx}" y="${yMid + 18}" ${RDV.MONO} font-size="10" fill="${C.ink3}">${d.acc_ci[0].toFixed(2)}–${d.acc_ci[1].toFixed(2)}</text>`;
    s += `<text x="${costX}" y="${yMid + 4.5}" text-anchor="end" ${RDV.MONO} font-size="13" font-weight="${hi ? 700 : 500}" fill="${hi ? C.ink : C.ink2}">${d.cost_per_1k_usd == null ? "credits" : RDV.money(d.cost_per_1k_usd)}</text>`;
    if (i < rows.length - 1) s += `<line x1="0" x2="${W}" y1="${top0 + (i + 1) * rowH - 6}" y2="${top0 + (i + 1) * rowH - 6}" stroke="#edeff0"/>`;
  });
  s += `</svg>`;
  document.getElementById("chart").innerHTML = s;
  const P = (E.paired || []).find((p) => p.a === "lora" && p.b === "base");
  const T = M.teacher;
  document.getElementById("foot").innerHTML = (P ? `LoRA vs base on the same pairs: <b>${P.gain >= 0 ? "+" : ""}${(P.gain * 100).toFixed(1)} pts</b> (95% CI ${(P.ci[0] * 100).toFixed(1)} to ${(P.ci[1] * 100).toFixed(1)}), exact McNemar p ${P.p < 0.001 ? "&lt; 0.001" : "= " + P.p.toFixed(3)} on ${P.only_a + P.only_b} discordant pairs. ` : "") +
    (T && L && T.cost_per_1k_usd ? `The teacher costs ${RDV.money(T.cost_per_1k_usd)} per 1,000 pairs, about ${Math.round(T.cost_per_1k_usd / Math.max(1e-6, L.cost_per_1k_usd))}× the LoRA. ` : "") +
    `Backboard rows, if present, are billed in Backboard credits, not Tinker list prices.`;
  RDV.mark(["eval"]);
})();
</script>
</body>
</html>
