<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spend breakdown</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Public+Sans:wght@400..700&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .tiles { grid-template-columns: repeat(4, 1fr); }
</style>
</head>
<body>
<div id="frame">
  <div class="kicker" id="kicker"></div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div class="chart" id="chart"></div>
  <div class="tiles" id="tiles"></div>
  <p class="foot" id="foot"></p>
  <div class="src"><span>Source: ml/results/spend.json (every ml/ script adds its stage) · per-1k from ml/results/eval.json</span><span class="brand">RECALLDESK</span></div>
</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const S = RD.spend, E = RD.eval, C = RDV.C;
  const LABEL = {
    spec_extract: ["Teacher: recall → spec", "one RecallSpec per CPSC recall"],
    spec_extract_live: ["Teacher: live specs", "new recalls in the weekly sweep"],
    teacher_label: ["Teacher: label pairs", "match / check / no_match for every pair"],
    train_tinker: ["LoRA training", "rank-32 SFT + held-out NLL per epoch"],
  };
  const lab = (k) => LABEL[k] || (k.startsWith("eval_") ? [`Eval: ${k.slice(5).replace("_", " ")}`, "one pass over the test pairs"] : [k, ""]);
  const rows = Object.entries(S.stages).filter(([k, v]) => (v.est_usd || 0) > 0)
    .map(([k, v]) => ({ k, usd: v.est_usd, model: v.model || "", l: lab(k) })).sort((a, b) => b.usd - a.usd);
  const total = S.total;
  const L = E.models.lora, T = E.models.teacher;
  document.getElementById("kicker").textContent = `What it cost · Tinker list prices × tokens actually used · SerpApi counted in searches`;
  document.getElementById("h1").textContent = `The whole ML pipeline cost ${RDV.money(total)}` +
    (L && T && L.cost_per_1k_usd != null && T.cost_per_1k_usd ? `. The student then reads 1,000 listings for ${RDV.money(L.cost_per_1k_usd)}, the teacher for ${RDV.money(T.cost_per_1k_usd)}.` : ".");
  document.getElementById("sub").textContent = `Teacher = Qwen3.5-397B-A17B, student = Qwen3.5-4B, both on Tinker. Estimates from token counts, not an invoice.`;

  const W = 718, LW = 300, x0 = LW, x1 = W - 70, rowH = 40, H = rows.length * rowH + 4;
  const max = Math.max(...rows.map((r) => r.usd), 0.0001), sx = (v) => ((x1 - x0) * v) / max;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spend: ${rows.map((r) => r.l[0] + " " + RDV.money(r.usd)).join(", ")}">`;
  rows.forEach((r, i) => {
    const y = i * rowH + 6, mid = y + 11, ours = /student|LoRA|Qwen3\.5-4B/.test(r.model) || r.k === "train_tinker";
    s += `<text x="0" y="${mid}" font-size="13.5" font-weight="600" fill="${C.ink}">${RDV.esc(r.l[0])}</text>`;
    s += `<text x="0" y="${mid + 15}" font-size="11.5" fill="${C.ink3}">${RDV.esc(r.l[1])}${/397B/.test(r.model) ? " · 397B" : /4B/.test(r.model) ? " · 4B" : ""}</text>`;
    s += `<rect x="${x0}" y="${y}" width="${Math.max(2, sx(r.usd))}" height="22" rx="3" fill="${ours ? C.ours : C.other}"/>`;
    s += `<text x="${x0 + Math.max(2, sx(r.usd)) + 8}" y="${mid + 5}" ${RDV.MONO} font-size="13" font-weight="600" fill="${C.ink}">${RDV.money(r.usd)}</text>`;
  });
  s += `</svg>`;
  document.getElementById("chart").innerHTML = s;
  const tiles = [
    [RDV.money(total), "total Tinker spend, every stage", "key"],
    [RDV.n(S.searches), "SerpApi eBay searches spent (each cached, never re-spent)", ""],
    [L && L.cost_per_1k_usd != null ? RDV.money(L.cost_per_1k_usd) : "n/a", "LoRA: per 1,000 listings read", ""],
    [T && T.cost_per_1k_usd != null ? RDV.money(T.cost_per_1k_usd) : "n/a", "teacher: per 1,000 listings read", ""],
  ];
  document.getElementById("tiles").innerHTML = tiles.map(([v, l, k]) => `<div class="tile ${k}"><b>${v}</b><span>${l}</span></div>`).join("");
  document.getElementById("foot").innerHTML = `Not included: Backboard credits for the baseline models and memory, and the human labelling time (~${RD.eval.test_size || "n"} test pairs). ${S.status === "real" ? RDV.esc(S.note || "") : ""}`;
  RDV.mark(["spend", "eval"]);
})();
</script>
</body>
</html>
